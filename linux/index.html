<!doctype html>
<html lang="tr">

<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Yapay Dünya Linux Center</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#070a0f;
 color:#eef2f7;
 font-family:system-ui,-apple-system,sans-serif
}

header{
 padding:18px;
 border-bottom:1px solid #252d38;
 background:#0b1017
}

h1{
 margin:0;
 font-size:20px
}

.sub{
 margin-top:5px;
 color:#8995a5;
 font-size:12px
}

main{
 max-width:1000px;
 margin:auto;
 padding:16px
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px
}

.card{
 background:#111720;
 border:1px solid #27313d;
 border-radius:14px;
 padding:14px
}

.label{
 color:#8995a5;
 font-size:12px
}

.value{
 margin-top:5px;
 font-size:14px;
 font-weight:700
}

.status{
 margin-top:16px;
 padding:13px;
 border-radius:12px;
 background:#101821;
 border:1px solid #293544
}

.terminal{
 margin-top:16px
}

.output{
 min-height:300px;
 max-height:500px;
 overflow:auto;
 background:#020304;
 border:1px solid #27313d;
 border-radius:12px;
 padding:14px;
 white-space:pre-wrap;
 font-family:monospace;
 font-size:13px
}

.row{
 display:flex;
 gap:8px;
 margin-top:10px
}

input{
 flex:1;
 min-width:0;
 background:#0c1118;
 border:1px solid #303b49;
 color:white;
 padding:13px;
 border-radius:10px;
 outline:none
}

button{
 border:0;
 border-radius:10px;
 padding:12px 14px;
 background:#1c2937;
 color:white;
 font-weight:700
}

button:active{
 transform:scale(.98)
}

@media(max-width:520px){
 .grid{
  grid-template-columns:1fr 1fr
 }
}
</style>
</head>

<body>

<header>
<h1>YAPAY DÜNYA / LINUX CENTER</h1>
<div class="sub">
Remote Linux • GitHub Codespace • World Engine
</div>
</header>

<main>

<div class="grid">

<div class="card">
<div class="label">Sistem</div>
<div id="system" class="value">...</div>
</div>

<div class="card">
<div class="label">Linux</div>
<div id="release" class="value">...</div>
</div>

<div class="card">
<div class="label">Python</div>
<div id="python" class="value">...</div>
</div>

<div class="card">
<div class="label">Kullanıcı / UID</div>
<div id="user" class="value">...</div>
</div>

</div>

<div class="status" id="status">
Bağlantı kontrol ediliyor...
</div>

<div id="output" class="output">
Yapay Dünya Remote Linux Center hazır.
</div>

<div class="row">
<input
 id="command"
 placeholder="Linux komutu..."
 autocomplete="off">
<button onclick="runCommand()">
ÇALIŞTIR
</button>
</div>

<div class="row">
<button onclick="quick('pwd')">PWD</button>
<button onclick="quick('ls -la')">LS</button>
<button onclick="quick('git status')">GIT</button>
<button onclick="quick('python3 --version')">PYTHON</button>
</div>

</main>

<script>

const output =
document.getElementById("output");

async function loadSystem(){

 try{

  const response =
  await fetch("/api/system");

  const d =
  await response.json();

  document.getElementById("system")
  .textContent =
  d.system + " / " + d.machine;

  document.getElementById("release")
  .textContent =
  d.release;

  document.getElementById("python")
  .textContent =
  d.python;

  document.getElementById("user")
  .textContent =
  d.user + " / UID " + d.uid;

  document.getElementById("status")
  .textContent =
  "REMOTE LINUX ONLINE";

 }catch(error){

  document.getElementById("status")
  .textContent =
  "Bağlantı hatası";

 }
}

async function runCommand(){

 const input =
 document.getElementById("command");

 const command =
 input.value.trim();

 if(!command) return;

 output.textContent +=
 "\n\n$ " + command + "\n";

 try{

  const response =
  await fetch("/api/terminal",{
   method:"POST",
   headers:{
    "Content-Type":
    "application/json"
   },
   body:JSON.stringify({
    command:command
   })
  });

  const data =
  await response.json();

  output.textContent +=
  data.output || "";

  output.scrollTop =
  output.scrollHeight;

 }catch(error){

  output.textContent +=
  "\nHATA: " + error;

 }

 input.value="";
}

function quick(command){

 document
 .getElementById("command")
 .value=command;

 runCommand();
}

document
.getElementById("command")
.addEventListener(
 "keydown",
 function(event){
  if(event.key==="Enter"){
   runCommand();
  }
 }
);

loadSystem();

</script>

</body>
</html>
