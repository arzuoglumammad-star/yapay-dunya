<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Yapay Dünya — Terminal</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 background:#050505;
 color:#e8e8e8;
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
 display:flex;
 flex-direction:column;
}

.header{
 height:58px;
 flex:none;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 14px;
 background:#0b0b0b;
 border-bottom:1px solid #222;
}

.title{
 font-weight:800;
 font-size:16px;
}

.subtitle{
 color:#777;
 font-size:10px;
 margin-top:2px;
}

.online{
 color:#35e878;
 font-size:11px;
 font-weight:700;
}

.terminal{
 flex:1;
 min-height:0;
 display:flex;
 flex-direction:column;
}

.output{
 flex:1;
 min-height:0;
 overflow:auto;
 padding:14px;
 background:#000;
 font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
 font-size:13px;
 line-height:1.55;
 white-space:pre-wrap;
 word-break:break-word;
}

.line{
 margin-bottom:5px;
}

.prompt{
 color:#36e879;
}

.cmd{
 color:#fff;
}

.err{
 color:#ff6868;
}

.inputbar{
 display:flex;
 flex:none;
 min-height:52px;
 background:#0b0b0b;
 border-top:1px solid #222;
}

.promptbox{
 display:flex;
 align-items:center;
 padding-left:12px;
 color:#36e879;
 font-family:monospace;
}

input{
 flex:1;
 min-width:0;
 border:0;
 outline:0;
 background:transparent;
 color:#fff;
 padding:0 8px;
 font-family:monospace;
 font-size:14px;
}

button{
 border:0;
 background:#151515;
 color:#fff;
 padding:0 15px;
 font-weight:700;
}

.quick{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:6px;
 padding:8px;
 background:#0b0b0b;
 border-top:1px solid #222;
}

.quick button{
 min-height:36px;
 border:1px solid #252525;
 border-radius:8px;
 font-size:10px;
}

.info{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px;
 padding:7px;
 background:#090909;
 border-top:1px solid #222;
}

.info div{
 background:#111;
 border:1px solid #222;
 border-radius:7px;
 padding:6px;
}

.info small{
 display:block;
 color:#666;
 font-size:8px;
}

.info b{
 display:block;
 margin-top:2px;
 font-size:10px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}
</style>
</head>

<body>

<header class="header">
 <div>
  <div class="title">🐧 Yapay Dünya Terminal</div>
  <div class="subtitle">Linux • Remote Runtime</div>
 </div>

 <div id="online" class="online">BAĞLANIYOR</div>
</header>

<section class="info">
 <div>
  <small>SİSTEM</small>
  <b id="system">-</b>
 </div>
 <div>
  <small>PYTHON</small>
  <b id="python">-</b>
 </div>
 <div>
  <small>KULLANICI</small>
  <b id="user">-</b>
 </div>
</section>

<main class="terminal">

 <div id="output" class="output">
  <div class="line">
   <span class="prompt">yapay-dunya@linux:~$</span>
   Yapay Dünya Terminal hazır.
  </div>

  <div class="line">
   Linux komutunu yaz ve ENTER'a bas.
  </div>
 </div>

 <div class="quick">
  <button onclick="runQuick('pwd')">PWD</button>
  <button onclick="runQuick('ls -la')">DOSYALAR</button>
  <button onclick="runQuick('python3 --version')">PYTHON</button>
  <button onclick="runQuick('git status')">GIT</button>
 </div>

 <div class="inputbar">
  <div class="promptbox">$</div>

  <input
   id="input"
   autocomplete="off"
   autocapitalize="off"
   spellcheck="false"
   placeholder="Linux komutu..."
  >

  <button onclick="execute()">ÇALIŞTIR</button>
 </div>

</main>

<script>

const API = "";

const output =
 document.getElementById("output");

const input =
 document.getElementById("input");

function add(text,className=""){

 const line=document.createElement("div");

 line.className="line "+className;

 line.textContent=text;

 output.appendChild(line);

 output.scrollTop=output.scrollHeight;
}

async function execute(){

 const command=input.value.trim();

 if(!command) return;

 input.value="";

 add("$ "+command,"cmd");

 try{

  const response=await fetch(
   API+"/api/terminal",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     command:command
    })
   }
  );

  const data=await response.json();

  if(data.output)
   add(data.output);

  if(data.error)
   add(data.error,"err");

 }catch(error){

  add(
   "TERMINAL BAĞLANTI HATASI: "+
   error.message,
   "err"
  );

 }

}

function runQuick(command){

 input.value=command;

 execute();

}

input.addEventListener(
 "keydown",
 function(event){

  if(event.key==="Enter")
   execute();

 }
);

async function systemInfo(){

 try{

  const response=
   await fetch("/api/system");

  const data=
   await response.json();

  document.getElementById("system")
   .textContent=
   data.system || data.release || "-";

  document.getElementById("python")
   .textContent=
   data.python || "-";

  document.getElementById("user")
   .textContent=
   data.user || "-";

  document.getElementById("online")
   .textContent="● ONLINE";

 }catch(e){

  document.getElementById("online")
   .textContent="● OFFLINE";

 }

}

systemInfo();

setInterval(systemInfo,5000);

input.focus();

</script>

</body>
</html>
