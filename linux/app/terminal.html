<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Yapay Dünya — Linux Terminal</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 background:#05070a;
 color:#e8edf5;
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 overflow:hidden
}

body{
 display:flex;
 flex-direction:column
}

.header{
 height:60px;
 flex:none;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 14px;
 background:#0b1016;
 border-bottom:1px solid #202833
}

.title{
 font-weight:800;
 font-size:16px
}

.sub{
 color:#758091;
 font-size:9px;
 margin-top:2px
}

.status{
 color:#38e77f;
 font-size:11px;
 font-weight:800
}

.system{
 flex:none;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px;
 padding:7px;
 background:#080c11
}

.card{
 min-width:0;
 padding:7px;
 border:1px solid #1d2630;
 border-radius:9px;
 background:#0d131a
}

.card small{
 display:block;
 color:#697585;
 font-size:8px
}

.card b{
 display:block;
 margin-top:2px;
 font-size:10px;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap
}

.terminal{
 flex:1;
 min-height:0;
 display:flex;
 flex-direction:column;
 background:#000
}

.output{
 flex:1;
 min-height:0;
 overflow:auto;
 padding:13px;
 font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
 font-size:13px;
 line-height:1.55;
 white-space:pre-wrap;
 word-break:break-word
}

.line{
 margin-bottom:5px
}

.prompt{
 color:#39e77f
}

.command{
 color:#fff
}

.error{
 color:#ff6868
}

.inputbar{
 flex:none;
 min-height:54px;
 display:flex;
 align-items:center;
 border-top:1px solid #222;
 background:#0a0d11
}

.dollar{
 padding-left:12px;
 color:#39e77f;
 font-family:monospace;
 font-size:15px
}

input{
 flex:1;
 min-width:0;
 height:54px;
 border:0;
 outline:0;
 background:transparent;
 color:#fff;
 padding:0 9px;
 font-family:monospace;
 font-size:14px
}

.run{
 height:38px;
 margin-right:7px;
 padding:0 12px;
 border:1px solid #29333e;
 border-radius:9px;
 background:#131b24;
 color:#fff;
 font-weight:800
}

.quick{
 flex:none;
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:5px;
 padding:7px;
 background:#090d12;
 border-top:1px solid #202833
}

.quick button{
 min-height:34px;
 border:1px solid #222c36;
 border-radius:8px;
 background:#111821;
 color:#dbe3ec;
 font-size:9px;
 font-weight:700
}

.bottom{
 flex:none;
 padding:6px 10px;
 background:#0b1016;
 border-top:1px solid #202833;
 color:#657282;
 font-size:9px;
 text-align:center
}
</style>
</head>

<body>

<header class="header">
 <div>
  <div class="title">🐧 Yapay Dünya Terminal</div>
  <div class="sub">Linux Remote Runtime • Integrated Terminal</div>
 </div>
 <div id="status" class="status">● BAĞLANIYOR</div>
</header>

<section class="system">
 <div class="card">
  <small>SİSTEM</small>
  <b id="system">-</b>
 </div>

 <div class="card">
  <small>PYTHON</small>
  <b id="python">-</b>
 </div>

 <div class="card">
  <small>KULLANICI</small>
  <b id="user">-</b>
 </div>
</section>

<main class="terminal">

 <div id="output" class="output">
  <div class="line">
   <span class="prompt">yapay-dunya@linux:~$</span>
   Yapay Dünya Linux Terminali başlatıldı.
  </div>

  <div class="line">
   Linux komutunu yazıp ENTER'a bas.
  </div>
 </div>

 <div class="quick">
  <button onclick="quick('pwd')">PWD</button>
  <button onclick="quick('ls -la')">LS</button>
  <button onclick="quick('python3 --version')">PYTHON</button>
  <button onclick="quick('git status --short --branch')">GIT</button>
  <button onclick="quick('uname -a')">SYSTEM</button>
 </div>

 <div class="inputbar">
  <span class="dollar">$</span>

  <input
   id="input"
   type="text"
   autocomplete="off"
   autocapitalize="off"
   spellcheck="false"
   placeholder="Linux komutu..."
  >

  <button class="run" onclick="execute()">ÇALIŞTIR</button>
 </div>

</main>

<div class="bottom">
 /workspaces/yapay-dunya • Linux Center
</div>

<script>

const output=document.getElementById("output");
const input=document.getElementById("input");

function print(text,cls=""){
 const el=document.createElement("div");
 el.className="line "+cls;
 el.textContent=text;
 output.appendChild(el);
 output.scrollTop=output.scrollHeight;
}

async function execute(){

 const command=input.value.trim();

 if(!command) return;

 input.value="";

 print("$ "+command,"command");

 try{

  const response=await fetch("/api/terminal",{
   method:"POST",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    command:command
   })
  });

  const data=await response.json();

  if(data.output)
   print(data.output);

  if(data.error)
   print(data.error,"error");

 }catch(error){

  print(
   "TERMINAL HATASI: "+error.message,
   "error"
  );

 }

}

function quick(command){

 input.value=command;
 execute();

}

input.addEventListener("keydown",function(e){

 if(e.key==="Enter")
  execute();

});

async function systemInfo(){

 try{

  const response=await fetch("/api/system");
  const data=await response.json();

  document.getElementById("system").textContent=
   data.system ||
   data.release ||
   data.machine ||
   "Linux";

  document.getElementById("python").textContent=
   data.python || "-";

  document.getElementById("user").textContent=
   data.user || "-";

  document.getElementById("status").textContent=
   "● ONLINE";

 }catch(e){

  document.getElementById("status").textContent=
   "● OFFLINE";

 }

}

systemInfo();
setInterval(systemInfo,5000);

input.focus();

</script>

</body>
</html>
