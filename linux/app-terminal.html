<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>Yapay Dünya Terminal</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#05070a;
    color:#edf2f7;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

.header{
    height:62px;
    min-height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:
        env(safe-area-inset-top)
        15px
        0
        15px;

    border-bottom:1px solid #202731;
    background:#0b0f14;
}

.brand{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo{
    width:34px;
    height:34px;
    border-radius:10px;
    display:grid;
    place-items:center;
    background:#171e27;
    font-size:18px;
}

.title{
    font-size:16px;
    font-weight:750;
}

.subtitle{
    color:#7e8996;
    font-size:10px;
    margin-top:2px;
}

.online{
    color:#63e49a;
    font-size:11px;
    font-weight:700;
}

.workspace{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
}

.output{
    flex:1;
    min-height:0;
    overflow:auto;
    padding:14px;
    background:#020406;
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    font-size:13px;
    line-height:1.55;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.output-line{
    margin-bottom:5px;
}

.command{
    color:#67a5ff;
}

.success{
    color:#65df98;
}

.error{
    color:#ff7373;
}

.muted{
    color:#75808d;
}

.quick{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:9px 10px;
    background:#0b0f14;
    border-top:1px solid #202731;
}

.quick button{
    flex:0 0 auto;
    height:34px;
    padding:0 12px;
    border:1px solid #28313b;
    border-radius:9px;
    background:#141a21;
    color:#dfe6ed;
    font-size:12px;
}

.input{
    display:flex;
    gap:8px;
    padding:
        9px
        10px
        calc(9px + env(safe-area-inset-bottom))
        10px;

    background:#0b0f14;
}

.input input{
    min-width:0;
    flex:1;
    height:44px;
    border:1px solid #303a46;
    border-radius:11px;
    outline:none;
    padding:0 12px;
    background:#05070a;
    color:#fff;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

    font-size:14px;
}

.input button{
    width:92px;
    border:0;
    border-radius:11px;
    background:#287cff;
    color:white;
    font-weight:750;
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">

        <div class="logo">⌘</div>

        <div>
            <div class="title">
                Yapay Dünya Terminal
            </div>

            <div class="subtitle">
                Remote Linux Workspace
            </div>
        </div>

    </div>

    <div id="connection"
         class="online">
        BAĞLANIYOR
    </div>

</header>

<main class="workspace">

    <div id="output"
         class="output"></div>

    <div class="quick">

        <button onclick="YDTerminal.run('pwd')">
            PWD
        </button>

        <button onclick="YDTerminal.run('ls -la')">
            LS
        </button>

        <button onclick="YDTerminal.run('git status --short --branch')">
            GIT
        </button>

        <button onclick="YDTerminal.run('python3 --version')">
            PYTHON
        </button>

        <button onclick="YDTerminal.run('whoami')">
            WHOAMI
        </button>

        <button onclick="YDTerminal.run('uname -a')">
            LINUX
        </button>

    </div>

    <div class="input">

        <input
            id="command"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Linux komutu..."
        >

        <button onclick="YDTerminal.execute()">
            ÇALIŞTIR
        </button>

    </div>

</main>

<script src="/app.js"></script>

</body>
</html>
