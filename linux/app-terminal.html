<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Yapay Dünya — Terminal</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#05070a;color:#e8edf2;font-family:system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column}
header{
height:64px;display:flex;align-items:center;justify-content:space-between;
padding:0 16px;border-bottom:1px solid #20252c;background:#0b0f14
}
.title{font-size:18px;font-weight:700}
.status{font-size:12px;color:#58d68d}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#output{
flex:1;overflow:auto;padding:16px;
font-family:ui-monospace,SFMono-Regular,monospace;
font-size:13px;line-height:1.55;white-space:pre-wrap;
background:#020406
}
.line{margin-bottom:4px}
.prompt{color:#62a0ff}
.error{color:#ff7777}
.success{color:#69e69a}
.inputbar{
display:flex;gap:8px;padding:10px;border-top:1px solid #20252c;
background:#0b0f14
}
input{
flex:1;min-width:0;background:#05070a;color:white;
border:1px solid #303741;border-radius:10px;
padding:13px;font:14px ui-monospace,monospace;outline:none
}
button{
border:0;border-radius:10px;padding:0 18px;
background:#2478ff;color:white;font-weight:700
}
.quick{
display:flex;gap:7px;padding:8px 10px;overflow:auto;
border-top:1px solid #20252c;background:#0b0f14
}
.quick button{height:34px;white-space:nowrap;background:#171d25}
</style>
</head>
<body>

<header>
<div class="title">Yapay Dünya Terminal</div>
<div class="status" id="status">BAĞLANIYOR...</div>
</header>

<main>
<div id="output"></div>

<div class="quick">
<button onclick="run('pwd')">PWD</button>
<button onclick="run('ls -la')">LS</button>
<button onclick="run('git status --short --branch')">GIT</button>
<button onclick="run('python3 --version')">PYTHON</button>
<button onclick="run('whoami')">WHOAMI</button>
<button onclick="run('uname -a')">LINUX</button>
</div>

<div class="inputbar">
<input id="command" autocomplete="off" spellcheck="false"
placeholder="Linux komutu yaz...">
<button onclick="execute()">ÇALIŞTIR</button>
</div>
</main>

<script src="/app.js"></script>
</body>
</html>
