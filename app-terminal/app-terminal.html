<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b10">
<title>Yapay Dünya Terminal</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#080b10;
    color:#dce7e3;
    font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
body{
    display:flex;
    flex-direction:column;
    overflow:hidden;
}
header{
    height:58px;
    flex:0 0 58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    border-bottom:1px solid #202832;
    background:#0d1218;
}
.brand{
    font-weight:800;
    font-size:15px;
}
.sub{
    color:#7e8a96;
    font-size:10px;
    margin-top:3px;
}
.status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:11px;
    color:#77e0a0;
}
.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#49dc86;
    box-shadow:0 0 10px #49dc86;
}
#output{
    flex:1;
    overflow:auto;
    padding:14px;
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.45;
    font-size:13px;
}
.line{
    margin-bottom:10px;
}
.prompt{
    color:#6de2a0;
}
.cmd{
    color:#fff;
}
.out{
    color:#c9d2d8;
}
.err{
    color:#ff7d7d;
}
.system{
    color:#83b9ff;
}
.quick{
    display:flex;
    gap:7px;
    overflow:auto;
    padding:8px 10px;
    border-top:1px solid #202832;
    border-bottom:1px solid #202832;
    background:#0c1117;
}
button{
    border:1px solid #2a3440;
    background:#131a22;
    color:#d8e2e8;
    border-radius:9px;
    padding:8px 11px;
    font:inherit;
    font-size:11px;
    white-space:nowrap;
}
button:active{
    transform:scale(.97);
}
.inputbar{
    min-height:62px;
    display:flex;
    gap:8px;
    align-items:center;
    padding:9px;
    background:#0d1218;
}
#command{
    flex:1;
    min-width:0;
    height:44px;
    border:1px solid #2b3540;
    border-radius:10px;
    outline:none;
    background:#080c11;
    color:#fff;
    padding:0 12px;
    font:inherit;
    font-size:13px;
}
#run{
    width:72px;
    height:44px;
    background:#1c6b46;
    border-color:#2d8c60;
    font-weight:800;
}
</style>
</head>

<body>

<header>
    <div>
        <div class="brand">YAPAY DÜNYA · TERMINAL</div>
        <div class="sub">Linux / Codespace / World Engine</div>
    </div>
    <div class="status">
        <span class="dot"></span>
        ONLINE
    </div>
</header>

<div id="output"></div>

<div class="quick">
    <button onclick="run('pwd')">PWD</button>
    <button onclick="run('ls -la')">LS</button>
    <button onclick="run('git status --short --branch')">GIT</button>
    <button onclick="run('python3 --version')">PYTHON</button>
    <button onclick="run('uname -a')">LINUX</button>
    <button onclick="run('free -h')">RAM</button>
    <button onclick="run('df -h .')">DISK</button>
    <button onclick="run('ps aux | head -15')">PROCESS</button>
</div>

<div class="inputbar">
    <input
        id="command"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        placeholder="Linux komutu yaz..."
    >
    <button id="run">ÇALIŞTIR</button>
</div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("command");

function print(text, cls="out"){
    const div = document.createElement("div");
    div.className = "line " + cls;
    div.textContent = text;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
}

function run(command){
    command = String(command || "").trim();
    if(!command) return;

    print("$ " + command, "cmd");

    fetch("/api/command", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({command})
    })
    .then(r => r.json())
    .then(data => {
        if(data.stdout) print(data.stdout, "out");
        if(data.stderr) print(data.stderr, "err");
        if(data.duration_ms !== undefined){
            print("[exit " + data.code + " · " +
                  data.duration_ms + " ms]", "system");
        }
    })
    .catch(err => print("TERMINAL BAGLANTI HATASI: " + err, "err"));
}

document.getElementById("run").onclick = () => {
    const value = input.value;
    input.value = "";
    run(value);
};

input.addEventListener("keydown", e => {
    if(e.key === "Enter"){
        const value = input.value;
        input.value = "";
        run(value);
    }
});

print("YAPAY DÜNYA APP TERMINAL", "system");
print("Linux terminal bağlantısı hazırlanıyor...", "system");
run("pwd && whoami && python3 --version");
</script>

</body>
</html>
